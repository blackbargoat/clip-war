<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip War</title>
<meta name="description" content="StolenFromStream vs Grand Theft Clips. Race to Christmas.">
<meta name="theme-color" content="#0e0c0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M8 48 L12 18 L24 32 L32 12 L40 32 L52 18 L56 48 Z' fill='%23e8b448'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795059739">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="5" fill="currentColor"/><path d="M10 8.5v7l6-3.5z" fill="var(--bg)"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 18 4.5 7l4.5 5 3-7 3 7 4.5-5L21 18Z" fill="currentColor"/><rect x="3" y="19.2" width="18" height="2" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="currentColor"/><rect x="2" y="6" width="20" height="4" rx="1.5" fill="currentColor"/><path d="M12 6v15" stroke="var(--bg)" stroke-width="2"/><path d="M12 6c-1.5-3-5-3.5-5-1.2C7 6 9.5 6 12 6Zm0 0c1.5-3 5-3.5 5-1.2C17 6 14.5 6 12 6Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-flake" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="M9 3.5 12 6l3-2.5M9 20.5 12 18l3 2.5M3.6 10.6l3.6-.8L6.1 6.3M20.4 13.4l-3.6.8 1.1 3.5M3.6 13.4l3.6.8-1.1 3.5M20.4 10.6l-3.6-.8 1.1-3.5"/></g></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v18M16 3v18M3 8h5M3 16h5M16 8h5M16 16h5" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="count" aria-label="Time left until Christmas">
    <svg class="ic"><use href="#i-gift"/></svg>
    <span id="cd">--</span>
  </div>
  <div class="fresh" id="fresh"><i></i><span>--</span></div>
</header>

<section class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="tag me" id="tag-me">
    <img class="pfp" id="pfp-me" alt="">
    <div class="big" id="n-me">0</div>
    <div class="who" id="name-me"></div>
  </div>
  <div class="tag him" id="tag-him">
    <img class="pfp" id="pfp-him" alt="">
    <div class="big" id="n-him">0</div>
    <div class="who" id="name-him"></div>
  </div>
  <div class="gap" id="gap"><span id="gap-n">0</span></div>
  <nav class="pick" id="pick">
    <button data-stat="views" class="on" aria-label="Total views"><svg><use href="#i-eye"/></svg><b class="cr"><svg><use href="#i-crown"/></svg></b></button>
    <button data-stat="subs" aria-label="Subscribers"><svg><use href="#i-user"/></svg><b class="cr"><svg><use href="#i-crown"/></svg></b></button>
    <button data-stat="top" aria-label="Most viewed video"><svg><use href="#i-play"/></svg><b class="cr"><svg><use href="#i-crown"/></svg></b></button>
  </nav>
</section>

<section class="clock" aria-label="Countdown to Christmas">
  <div class="digits">
    <div><b id="cd-d">00</b><i>D</i></div><span>:</span>
    <div><b id="cd-h">00</b><i>H</i></div><span>:</span>
    <div><b id="cd-m">00</b><i>M</i></div><span>:</span>
    <div><b id="cd-s">00</b><i>S</i></div>
  </div>
  <div class="track"><i id="track-fill"></i><svg class="flake" id="flake" viewBox="0 0 24 24"><use href="#i-flake"/></svg><svg class="ic end"><use href="#i-gift"/></svg></div>
</section>

<section class="crowns" id="crowns">
  <div class="row" data-stat="views">
    <svg class="ic lead"><use href="#i-eye"/></svg>
    <div class="side me"><span class="v">0</span></div>
    <div class="bar"><i class="me"></i><i class="him"></i><b class="crownmark"><svg><use href="#i-crown"/></svg></b></div>
    <div class="side him"><span class="v">0</span></div>
  </div>
  <div class="row" data-stat="subs">
    <svg class="ic lead"><use href="#i-user"/></svg>
    <div class="side me"><span class="v">0</span></div>
    <div class="bar"><i class="me"></i><i class="him"></i><b class="crownmark"><svg><use href="#i-crown"/></svg></b></div>
    <div class="side him"><span class="v">0</span></div>
  </div>
  <div class="row" data-stat="top">
    <svg class="ic lead"><use href="#i-play"/></svg>
    <div class="side me"><span class="v">0</span></div>
    <div class="bar"><i class="me"></i><i class="him"></i><b class="crownmark"><svg><use href="#i-crown"/></svg></b></div>
    <div class="side him"><span class="v">0</span></div>
  </div>
</section>

<section class="race">
  <svg class="ic head"><use href="#i-eye"/></svg>
  <div class="chart" id="chart"></div>
</section>

<section class="tops">
  <a class="card me" id="card-me" target="_blank" rel="noopener">
    <div class="thumb"><img alt=""><div class="empty"><svg><use href="#i-play"/></svg></div></div>
    <b class="crownmark"><svg><use href="#i-crown"/></svg></b>
    <div class="meta"><svg class="ic"><use href="#i-eye"/></svg><span class="v">0</span></div>
    <div class="meta dim"><svg class="ic"><use href="#i-film"/></svg><span class="c">0</span></div>
  </a>
  <div class="vs">VS</div>
  <a class="card him" id="card-him" target="_blank" rel="noopener">
    <div class="thumb"><img alt=""><div class="empty"><svg><use href="#i-play"/></svg></div></div>
    <b class="crownmark"><svg><use href="#i-crown"/></svg></b>
    <div class="meta"><svg class="ic"><use href="#i-eye"/></svg><span class="v">0</span></div>
    <div class="meta dim"><svg class="ic"><use href="#i-film"/></svg><span class="c">0</span></div>
  </a>
</section>

<section class="wall" id="wall">
  <div class="wall-inner" id="wall-inner"></div>
</section>

<footer class="foot">
  <a id="yt-me" target="_blank" rel="noopener"><img id="f-me" alt=""></a>
  <span>12.25</span>
  <a id="yt-him" target="_blank" rel="noopener"><img id="f-him" alt=""></a>
</footer>

<script type="module" src="main.js?v=1795059739"></script>
</body>
</html>
